spring:
  application:
    name: pedidoestoque
  datasource:
    # Mudamos de pedidoestoque para postgres na URL abaixo:
    url: jdbc:postgresql://localhost:5432/pedidoestoque
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080